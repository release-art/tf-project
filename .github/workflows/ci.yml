# Every gate on each push / PR against main, and a wheel per platform that installs and runs, as does the
# standalone download made from it.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Reusable: release.yml calls this to gate publication on a green build.
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    # Format, clippy, docs, licences, tests, 100% coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install # the version pinned in rust/rust-toolchain.toml
        working-directory: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny
      - run: bin/rust/check.sh
        env:
          NEXTEST_PROFILE: ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./bin

  wheels:
    # The programs packaged as a py3-none wheel per platform, installed into a clean venv and run.
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # maturin runs cargo from the root, where rust/rust-toolchain.toml is not seen: pass the pinned toolchain.
      - run: echo "RUST_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_ENV"
        shell: bash
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Install on a clean interpreter and run both names
        shell: bash
        run: |
          python -m venv clean
          bin=clean/bin; [ -d clean/Scripts ] && bin=clean/Scripts
          "$bin/pip" install dist/*.whl
          "$bin/tf-project" --version
          "$bin/tfp" --help
      - name: Pack the standalone download, unpack it and run it
        shell: bash
        run: |
          archive=$(python bin/rust/archive.py dist/*.whl "${{ matrix.target }}" binaries)
          mkdir unpacked
          if [[ "$archive" == *.zip ]]; then unzip -q "$archive" -d unpacked; else tar xzf "$archive" -C unpacked; fi
          unpacked/*/tfp --version

  sdist:
    # The source distribution, and the PyPI metadata (README rendering) both kinds of artifact carry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - run: pipx run twine check --strict dist/*
