# Tag-driven release pipeline.
#
# Push a tag matching `v*.*.*` (e.g. `v2.0.0`, `v2.1.0rc1`) and this workflow:
#   1. Re-runs CI against the tagged commit.
#   2. Builds a wheel per platform and the sdist, with the version set from the tag, and packs each wheel's
#      programs as a standalone download (.tar.gz, .zip for Windows) for the GitHub Release.
#   3. Signs them with Sigstore (transparency-logged, keyless).
#   4. Publishes to TestPyPI and then PyPI via OIDC trusted publishing.
#   5. Creates a GitHub Release with the changelog notes and the signed artifacts.
#
# No code-side version bump: bin/rust/set-version.sh writes the tag into rust/Cargo.toml, which maturin reads.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: bin/rust/set-version.sh "${GITHUB_REF_NAME#v}"
        shell: bash
      - run: echo "RUST_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_ENV"
        shell: bash
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Install on a clean interpreter and check the version
        shell: bash
        run: |
          python -m venv clean
          bin=clean/bin; [ -d clean/Scripts ] && bin=clean/Scripts
          "$bin/pip" install dist/*.whl
          "$bin/tfp" --version
          "$bin/python" -c "import importlib.metadata as m, sys; v = m.version('tf-project'); print(v); sys.exit(v != sys.argv[1])" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
      - name: Pack the programs for download without pip
        shell: bash
        run: python bin/rust/archive.py dist/*.whl "${{ matrix.target }}" binaries
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/*

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bin/rust/set-version.sh "${GITHUB_REF_NAME#v}"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI trusted publishing + Sigstore
      contents: write  # the GitHub Release
    steps:
      - uses: actions/checkout@v6
      # dist/ is what PyPI gets; the standalone downloads stay apart in binaries/.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.1
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
            ./binaries/*

      - name: Stash Sigstore bundles outside dist/
        # `pypa/gh-action-pypi-publish` uploads everything in `dist/` and rejects `.sigstore.json`.
        run: |
          mkdir -p signatures
          mv dist/*.sigstore.json binaries/*.sigstore.json signatures/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false  # the PyPI step below makes the real ones

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Resolve version and prerelease flag
        # PEP 440 pre-release suffixes anchored at the end of the version (aN/bN/rcN/.devN ...).
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+((a|b|c|rc|alpha|beta|pre|preview)[0-9]+|\.dev[0-9]+)$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.ver.outputs.version }}
          path: ./CHANGELOG.md
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes || format('Release {0}. See [CHANGELOG.md](CHANGELOG.md) for details.', github.ref_name) }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            binaries/*
            signatures/*.sigstore.json
          fail_on_unmatched_files: true
