[package]
name = "tf-project"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Terraform / OpenTofu wrapper with named per-tfvars slots, cached `.terraform/`, 1Password secret injection, and apply-safety guards."
repository = "https://github.com/release-art/tf-project"
publish = false

# Two names for one program, as the Python package's [project.scripts] had: tf-project (src/main.rs) and tfp.
[[bin]]
name = "tfp"
path = "src/bin/tfp.rs"

[dependencies]
async-trait = "0.1.89"
azure_core = "1.1.0"
azure_identity = "1.0.0"
azure_security_keyvault_certificates = "1.0.1"
azure_security_keyvault_keys = "1.0.1"
azure_security_keyvault_secrets = "1.0.1"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
ctrlc = "3.5.3"
dunce = "1.0.5"
futures = "0.3.31"
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
shlex = "2.0.1"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["net", "rt", "time"] }
toml = "1.2.3"
walkdir = "2.5.1"
which = "8.0.6"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
# Smaller programs: the wheel carries two (tf-project, tfp), and the Azure SDK is large.
strip = true
lto = true
codegen-units = 1
