---
# Tag-driven release pipeline.
#
# Push a tag matching `v*.*.*` (e.g. `v0.2.0`, `v1.0.0rc1`) and this workflow:
#   1. Re-runs CI (lint, type-check, test) against the tagged commit.
#   2. Builds the sdist + wheel with the version pinned from the tag.
#   3. Signs both artifacts with Sigstore (transparency-logged, keyless).
#   4. Publishes to TestPyPI and then PyPI via OIDC trusted publishing.
#   5. Creates a GitHub Release with changelog notes and the signed
#      artifacts (.whl + .tar.gz + .sigstore.json bundles) attached.
#
# No code-side version bump — the next release version is whatever you
# tag next. `pyproject.toml`'s `[tool.pdm.version] source = "scm"` derives
# the wheel version from `${GITHUB_REF_NAME#v}`.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for PyPI OIDC trusted publishing + Sigstore
      contents: write  # Required for creating GitHub Releases
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # pdm-backend SCM versioning needs tag history

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PDM
        run: python -m pip install pdm

      - name: Build packages
        # Pin the version explicitly from the tag. Bypasses pdm-backend's
        # SCM dirty-tree detection, which can append a PEP-440 local
        # segment (e.g. `+d20260521`) that PyPI rejects with 400.
        run: |
          export PDM_BUILD_SCM_VERSION="${GITHUB_REF_NAME#v}"
          pdm build

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.1
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz

      - name: Stash Sigstore bundles outside dist/
        # `pypa/gh-action-pypi-publish` uploads everything in `dist/` and
        # rejects `.sigstore.json` as an "unknown distribution format". Move
        # the bundles to a sibling directory before publishing; the GitHub
        # Release step picks them up from there.
        run: |
          mkdir -p signatures
          mv dist/*.sigstore.json signatures/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Extract release notes from CHANGELOG
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          # Tag is `v1.2.1`; CHANGELOG entries are headed `## [1.2.1]`.
          version: ${{ github.ref_name }}
          path: ./CHANGELOG.md
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes || format('Release {0}. See [CHANGELOG.md](CHANGELOG.md) for details.', github.ref_name) }}
          # Tags like v1.2.3rc1, v1.2.3a1, v1.2.3.dev0 → pre-release.
          # Plain v1.2.3 → stable.
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'dev') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            signatures/*.sigstore.json
          fail_on_unmatched_files: true
