# Tests may panic: a failed assertion is how they report.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

# Product names clippy would otherwise want in backticks; clap shows doc comments as --help text.
doc-valid-idents = ["OpenTofu", ".."]
