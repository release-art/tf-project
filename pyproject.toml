[project]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
name = "tf-project"
description = "Terraform / OpenTofu wrapper with named per-tfvars slots, cached `.terraform/`, 1Password secret injection, and apply-safety guards."
keywords = [
    "terraform",
    "opentofu",
    "tofu",
    "infrastructure-as-code",
    "iac",
    "devops",
    "cli",
    "wrapper",
    "tfvars",
    "multi-environment",
    "workspaces",
    "1password",
    "op-cli",
    "secrets",
    "azurerm",
    "s3-backend",
    "terraform-state",
]

authors = [
    {name = "Ilja Orlovs", email = "ilja@release.art"},
]
maintainers = [
    {name = "Ilja Orlovs", email = "ilja@release.art"},
]

dynamic = ["version"]

license = "MIT"

readme = "README.md"

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/release-art/tf-project"
Repository = "https://github.com/release-art/tf-project"
Documentation = "https://github.com/release-art/tf-project#readme"
Changelog = "https://github.com/release-art/tf-project/blob/main/CHANGELOG.md"
Issues = "https://github.com/release-art/tf-project/issues"
Releases = "https://github.com/release-art/tf-project/releases"

[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

# The wheel holds the two programs `tf-project` and `tfp`, built from rust/ (no Python inside). Its version is
# rust/Cargo.toml's: 0.0.0 in the tree, set from the release tag (v1.2.3) by bin/rust/set-version.sh.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
bindings = "bin"
